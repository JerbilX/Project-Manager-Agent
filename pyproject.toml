[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-manager-agent"
version = "0.1.0"
description = "Deterministic batch issue orchestrator CLI and Staff Technical PM skill for Antigravity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pm-agent = "project_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
